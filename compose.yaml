services:
  mongodb:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status(); quit(db.hello().isWritablePrimary ? 0 : 1) }
          catch (error) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}); quit(1) }"
      interval: 1s
      timeout: 5s
      retries: 15
    volumes:
      - mongodb-data:/data/db

volumes:
  mongodb-data:
